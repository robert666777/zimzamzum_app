<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZimZamZum Active Task</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      pointer-events: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* Blue border + inner glow on entire screen perimeter */
    .border-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      border: 2.5px solid #3b82f6;
      box-shadow:
        inset 0 0 70px 27.5px rgba(37, 99, 235, 0.75),
        inset 0 0 30px 11px rgba(96, 165, 250, 0.55),
        0 0 45px 15px rgba(37, 99, 235, 0.4);
    }

    .edge-top,
    .edge-bottom,
    .edge-left,
    .edge-right {
      position: fixed;
      pointer-events: none;
    }
    .edge-top,
    .edge-bottom,
    .edge-left,
    .edge-right {
      z-index: 2;
    }

    .edge-top {
      top: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: linear-gradient(
        to bottom,
        rgba(37, 99, 235, 0.475) 0%,
        rgba(59, 130, 246, 0.325) 35%,
        rgba(59, 130, 246, 0.1) 65%,
        transparent 100%
      );
    }

    .edge-bottom {
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: linear-gradient(
        to top,
        rgba(37, 99, 235, 0.475) 0%,
        rgba(59, 130, 246, 0.325) 35%,
        rgba(59, 130, 246, 0.1) 65%,
        transparent 100%
      );
    }

    .edge-left {
      top: 0;
      bottom: 0;
      left: 0;
      width: 65px;
      background: linear-gradient(
        to right,
        rgba(37, 99, 235, 0.475) 0%,
        rgba(59, 130, 246, 0.325) 35%,
        rgba(59, 130, 246, 0.1) 65%,
        transparent 100%
      );
    }

    .edge-right {
      top: 0;
      bottom: 0;
      right: 0;
      width: 65px;
      background: linear-gradient(
        to left,
        rgba(37, 99, 235, 0.475) 0%,
        rgba(59, 130, 246, 0.325) 35%,
        rgba(59, 130, 246, 0.1) 65%,
        transparent 100%
      );
    }

    /* Status pill — centered, no outer container */
    .status-wrap {
      position: fixed;
      top: 16px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      z-index: 20;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 11px 20px;
      background: #0f1f3d;
      border-radius: 999px;
      color: #f0f4fa;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.01em;
      white-space: nowrap;
      line-height: 1;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
    }

    .icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="border-glow" aria-hidden="true"></div>
  <div class="edge-top" aria-hidden="true"></div>
  <div class="edge-bottom" aria-hidden="true"></div>
  <div class="edge-left" aria-hidden="true"></div>
  <div class="edge-right" aria-hidden="true"></div>

  <div class="status-wrap">
    <div class="pill">
      <div class="icon" aria-hidden="true">Z</div>
      <span>ZimZamZum is using your screen</span>
    </div>
  </div>
</body>
</html>
